<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entretenimiento - Redirecciones</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 600;
        }
        .portal-description {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .redirect-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .redirect-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .redirect-btn:active {
            transform: translateY(0);
        }
        .btn-cuevana {
            background: linear-gradient(45deg, #FF6B6B, #FF8E8E);
        }
        .btn-anime {
            background: linear-gradient(45deg, #9C27B0, #BA68C8);
        }
        .btn-futbol {
            background: linear-gradient(45deg, #45B649, #6FD86F);
        }
        .btn-icon {
            font-size: 1.5em;
        }
        .footer-note {
            margin-top: 20px;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Entretenimiento</h1>
        <p class="portal-description">Haz clic en cualquier botón para ir directamente al sitio</p>
        
        <div class="button-container">
            <!-- Botón Cuevana - Redirección directa -->
            <a href="https://cue.cuevana3.nu/" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="redirect-btn btn-cuevana">
                <span class="btn-icon">🎥</span>
                Cuevana - Películas y Series
            </a>
            
            <!-- Botón Anime Latino - Redirección directa con ícono de anime -->
            <a href="https://www.animelatinohd.com/" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="redirect-btn btn-anime">
                <span class="btn-icon">🍜</span>
                Anime Latino HD
            </a>
            
            <!-- Botón Fútbol Libre - Redirección directa -->
            <a href="https://librefutboltv.su/home1/" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="redirect-btn btn-futbol">
                <span class="btn-icon">⚽</span>
                Fútbol Libre Oficial
            </a>
        </div>

        <div class="footer-note">
            ⚡ Haz clic en cualquier botón para acceder
        </div>
    </div>

    <!-- Script opcional para estadísticas de clics (puedes eliminarlo) -->
    <script>
        document.querySelectorAll('.redirect-btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const siteName = this.innerText.trim();
                console.log(`Redirigiendo a: ${siteName}`);
                // Aquí puedes agregar código para analytics si lo deseas
            });
        });
    </script>
</body>
</html>
